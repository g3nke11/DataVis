<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataVis — User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand"><a href="/">Data<span>Vis</span></a></div>
      <nav class="site-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/user.html" aria-current="page">User</a>
        <a href="/datasets.html">Datasets</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>User page</h1>
        <p class="lead" id="welcome-line">Loading…</p>
      </section>

      <section class="panel">
        <h2>Preferences (browser only)</h2>
        <p style="margin-top: 0; color: var(--muted); font-size: 0.92rem">
          There is no account system in this scaffold — settings are saved with <code>localStorage</code> so labeling
          and notes persist on this device.
        </p>
        <form id="user-form" style="margin-top: 1rem">
          <fieldset>
            <label for="display-name">Display name</label>
            <input id="display-name" name="displayName" type="text" autocomplete="name" placeholder="e.g. Avery" />
          </fieldset>
          <fieldset style="margin-top: 1rem">
            <label for="theme-note">Project / visualization notes</label>
            <textarea id="theme-note" name="themeNote" class="code" placeholder="Hypotheses, chart ideas, citation links…"></textarea>
          </fieldset>
          <div class="btn-row" style="margin-top: 1rem">
            <button type="submit" class="btn btn-primary">Save preferences</button>
            <button type="button" class="btn btn-ghost" id="clear-btn">Clear stored data</button>
          </div>
          <p id="save-msg" class="status-pill ok" style="margin-top: 0.85rem" hidden>Saved locally.</p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="/datasets.html">Open datasets →</a></p>
    </footer>

    <script src="/js/user.js"></script>
  </body>
</html>
